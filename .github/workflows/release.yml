name: Release

# On every push to main, changesets/action either opens or updates the "chore: version packages"
# pull request (while changesets are pending) or, once that pull request is merged, publishes the
# versions npm and JSR do not have yet. See docs/contributing.md#release.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version pull request or publish
    # Not in forks.
    if: github.repository == 'brc-dd/unplugin-deno'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # version commits, git tags, GitHub releases
      pull-requests: write # the version pull request
      id-token: write # trusted publishing on npm and JSR (OIDC), provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - name: Check that deno.json and package.json have the same version
        run: pnpm check-version
      # npm: trusted publishing (OIDC, no secret) once npmjs.com trusts this workflow. The optional
      # NPM_TOKEN secret (a granular access token) is the fallback: pnpm tries OIDC first and uses
      # the token when the exchange fails. The line is only written when the secret exists, since
      # pnpm would otherwise send an empty token.
      - name: Configure the NPM_TOKEN fallback
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"
            echo 'NPM_TOKEN is set: pnpm publish falls back to it when OIDC fails.'
          fi
      # `version-packages`: changeset version, deno.json version sync, lockfile refresh.
      # `release`: build, `changeset publish` (npm, skips published versions, tags), `deno publish`
      # (JSR over OIDC once the package is linked to this repository; skips published versions).
      - uses: changesets/action@v2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
