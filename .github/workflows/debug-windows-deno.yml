# Temporary: runs the `deno` engine contract tests on Windows under Node and under Deno with debug
# output, to fix the engine on the windows/deno CI row. Remove once that row is green.
name: Debug windows deno engine
on:
  workflow_dispatch:
jobs:
  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - name: Path shapes under Node and Deno
        shell: bash
        run: |
          cat > probe.mjs <<'EOF'
          import os from 'node:os'
          import fs from 'node:fs'
          import { realpath } from 'node:fs/promises'
          import { pathToFileURL } from 'node:url'
          const tmp = os.tmpdir()
          console.log('runtime', typeof Deno === 'undefined' ? 'node' : 'deno ' + Deno.version.deno)
          console.log('tmpdir', tmp)
          console.log('realpathSync', fs.realpathSync(tmp))
          console.log('realpathSync.native', fs.realpathSync.native(tmp))
          console.log('promises.realpath', await realpath(tmp))
          const dir = fs.mkdtempSync(tmp + '\\up-')
          console.log('mkdtemp', dir, '->', await realpath(dir))
          console.log('url', pathToFileURL(await realpath(dir)).href)
          fs.rmSync(dir, { recursive: true })
          EOF
          node probe.mjs
          deno run -A probe.mjs
      - name: Contract test under Node (verbose, debug)
        shell: bash
        continue-on-error: true
        env:
          DEBUG: unplugin-deno
        run: |
          cd packages/unplugin-deno
          pnpm exec vitest run src/engine/contract.test.ts -t "engine-basic" --reporter=verbose 2>&1 | tail -150
      - name: Contract test under Deno (verbose, debug)
        shell: bash
        continue-on-error: true
        env:
          DEBUG: unplugin-deno
        run: |
          cd packages/unplugin-deno
          deno run -A npm:vitest run src/engine/contract.test.ts -t "engine-basic" --reporter=verbose 2>&1 | tail -200
