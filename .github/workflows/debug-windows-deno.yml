# Temporary: reproduces the `deno` engine's `deno info --json` invocation on Windows against the
# engine-basic fixture and prints what Deno reports for the synthetic root module. Remove once the
# windows/deno CI row is green.
name: Debug windows deno engine
on:
  workflow_dispatch:
jobs:
  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Reproduce the engine's deno info run
        shell: bash
        run: |
          cd packages/unplugin-deno
          cat > probe.mjs <<'EOF'
          import { copyFile, mkdtemp, readFile, realpath, writeFile } from 'node:fs/promises'
          import { tmpdir } from 'node:os'
          import { join } from 'node:path'
          import { execFile } from 'node:child_process'
          import { promisify } from 'node:util'
          const fixture = join(process.cwd(), 'test', 'fixtures', 'engine-basic')
          const config = JSON.parse(await readFile(join(fixture, 'deno.json'), 'utf8'))
          const work = await realpath(await mkdtemp(join(tmpdir(), 'unplugin-deno-')))
          const root = join(work, 'root-1.mjs')
          const lines = Object.keys(config.imports ?? {}).map((key) => `import ${JSON.stringify(key)};`)
          lines.push('import "npm:kleur@^4/colors";', 'import "./src/util.ts";')
          await writeFile(root, lines.join('\n') + '\n')
          console.log('root file', root)
          console.log(await readFile(root, 'utf8'))
          const lock = join(work, 'deno.lock')
          await copyFile(join(fixture, 'deno.lock'), lock)
          for (const variant of [['abs', root], ['url', new URL('file:///' + root.replaceAll('\\', '/')).href]]) {
            const args = ['info', '--json', '--allow-import', '--config', join(fixture, 'deno.json'), '--lock', lock,
              '--node-modules-dir=none', '--unstable-sloppy-imports', '--unstable-raw-imports', variant[1]]
            console.log('=== variant', variant[0], 'args', JSON.stringify(args))
            try {
              const { stdout, stderr } = await promisify(execFile)('deno', args, { cwd: fixture, maxBuffer: 64e6,
                env: { ...process.env, NO_COLOR: '1', DENO_NO_UPDATE_CHECK: '1' } })
              console.log('stderr:', stderr.slice(0, 1500))
              const j = JSON.parse(stdout)
              console.log('roots', j.roots)
              const rootMod = j.modules.find((m) => m.specifier === j.roots[0])
              console.log('root module found:', rootMod !== undefined)
              console.log('root module:', JSON.stringify(rootMod, null, 1).slice(0, 2500))
              console.log('first specifiers', j.modules.slice(0, 8).map((m) => m.specifier + ' -> ' + (m.local ?? '(no local)')))
            } catch (error) {
              console.log('FAILED', error.code, String(error.stderr ?? error.message).slice(0, 2000))
            }
          }
          EOF
          node probe.mjs
